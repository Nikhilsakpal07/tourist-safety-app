name: tourist_mesh_app
description: Autonomous Tourist Safety & Offline Mesh app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State & Networking
  http: any
  connectivity_plus: any
  
  # Hardware & Radio
  flutter_ble_peripheral: any
  flutter_blue_plus: any
  geolocator: any
  
  # Storage
  sqflite: any
  path_provider: any
  path: any
  
  # Mapping
  flutter_map: any
  latlong2: any
  h3_flutter: any
  permission_handler: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
